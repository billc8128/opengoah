name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: node scripts/check-readme-contracts.mjs
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run pack:smoke
